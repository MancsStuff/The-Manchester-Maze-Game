<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>The Manchester Maze</title>
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
<style>
  :root{--ink:#1a1714;--paper:#d8cbb4;--paper-dark:#c2b196;--rust:#9a4b2b;--amber:#e0a23c;--moss:#7d9a6b;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#0d0b09;font-family:Georgia,'Times New Roman',serif;}
  #root{height:100%;}
  .stage{position:relative;width:100%;height:100dvh;overflow:hidden;background:#0d0b09;}
  .scene-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:sepia(.26) contrast(.9) brightness(.55) saturate(.7) blur(18px);transform:scale(1.1);}
  .scene-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:sepia(.26) contrast(.93) brightness(.99) saturate(.82);}
  .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%, transparent 46%, rgba(20,15,10,.5) 100%);}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.09;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/></svg>");}
  .fade{position:absolute;inset:0;z-index:30;background:#0d0b09;opacity:0;pointer-events:none;transition:opacity .5s ease;}
  .fade.on{opacity:1;}
  .topbar{position:absolute;top:12px;left:0;right:0;z-index:6;display:flex;justify-content:space-between;align-items:flex-start;padding:0 14px;pointer-events:none;}
  .chapter{font-family:'Courier New',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#f3ead6;background:rgba(20,15,10,.55);padding:4px 9px;border-radius:5px;}
  .titlecard{text-align:center;flex:1;}
  .titlecard .kicker{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--paper);opacity:.7;}
  .titlecard .place{font-size:20px;letter-spacing:.04em;color:#f3ead6;text-shadow:0 2px 10px rgba(0,0,0,.7);}
  .prog{font-family:'Courier New',monospace;font-size:10px;letter-spacing:.1em;color:#f3ead6;background:rgba(20,15,10,.55);padding:4px 9px;border-radius:5px;}
  .avatar{position:absolute;z-index:5;transform:translate(-50%,-100%);will-change:left,top;}
  .avatar .body{width:42px;height:66px;position:relative;}
  .avatar .head{position:absolute;left:50%;top:0;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;background:#caa07a;border:1.5px solid #5a3d28;}
  .avatar .hair{position:absolute;left:50%;top:-2px;transform:translateX(-50%);width:24px;height:12px;border-radius:12px 12px 0 0;background:#6b4a2f;}
  .avatar .torso{position:absolute;left:50%;top:22px;transform:translateX(-50%);width:28px;height:28px;border-radius:8px;background:#23262b;border:1.5px solid #0c0d0f;}
  .avatar .stripe{position:absolute;left:50%;top:25px;transform:translateX(-50%);width:6px;height:13px;background:#e9e4da;border-radius:2px;}
  .avatar .legs{position:absolute;left:50%;top:48px;transform:translateX(-50%);width:22px;height:18px;border-radius:5px;background:#15171a;}
  .avatar .shadow{position:absolute;left:50%;top:64px;transform:translateX(-50%);width:34px;height:10px;border-radius:50%;background:rgba(10,8,6,.5);filter:blur(2px);}
  .avatar.walking .body{animation:bob .42s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .nametag{position:absolute;left:50%;top:-13px;transform:translateX(-50%);font-family:'Courier New',monospace;font-size:10px;color:#f3ead6;white-space:nowrap;background:rgba(20,15,10,.7);padding:1px 7px;border-radius:4px;}
  .hotspot{position:absolute;z-index:4;transform:translate(-50%,-50%);cursor:pointer;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .hotspot .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--amber);animation:pulse 2.2s ease-out infinite;}
  .hotspot .ring.r2{animation-delay:1.1s;}
  @keyframes pulse{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.25);opacity:0}}
  .hotspot .core{width:13px;height:13px;border-radius:50%;background:var(--amber);box-shadow:0 0 14px 4px rgba(224,162,60,.7);}
  .hotspot .label{position:absolute;top:60px;left:50%;transform:translateX(-50%);font-family:'Courier New',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#f3ead6;background:rgba(20,15,10,.66);padding:2px 8px;border-radius:4px;white-space:nowrap;}
  .hotspot.done .core{background:var(--moss);box-shadow:0 0 10px 2px rgba(125,154,107,.5);}
  .hotspot.done .ring{display:none;}
  /* hidden spot: faint, no label until near */
  .hotspot.hidden{opacity:.32;transition:opacity .4s ease;}
  .hotspot.hidden .ring{border-color:#cdbfa6;animation-duration:3.4s;}
  .hotspot.hidden .core{background:#cdbfa6;box-shadow:0 0 8px 2px rgba(205,191,166,.45);width:10px;height:10px;}
  .hotspot.hidden .label{opacity:0;transition:opacity .3s ease;}
  .hotspot.hidden.near{opacity:.9;}
  .hotspot.hidden.near .label{opacity:1;}
  .hotspot.hidden.done .core{background:var(--moss);}
  .pad{position:absolute;right:16px;bottom:22px;z-index:7;width:146px;height:146px;}
  .pad button{position:absolute;width:46px;height:46px;border-radius:12px;background:rgba(30,24,18,.5);backdrop-filter:blur(3px);color:#f3ead6;font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid rgba(243,234,214,.18);}
  .pad button:active{background:rgba(224,162,60,.4);}
  .pad .up{top:0;left:50px;}.pad .down{bottom:0;left:50px;}.pad .left{top:50px;left:0;}.pad .right{top:50px;right:0;}
  .hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;z-index:7;font-family:'Courier New',monospace;font-size:10px;color:var(--paper);opacity:.55;pointer-events:none;}
  .scrim{position:absolute;inset:0;z-index:20;background:rgba(8,6,4,.82);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .35s ease;}
  .scrim.open{opacity:1;pointer-events:auto;}
  .card{max-width:430px;width:100%;background:var(--paper);color:var(--ink);border-radius:6px;padding:24px 22px 20px;box-shadow:0 18px 50px rgba(0,0,0,.6);transform:translateY(14px) scale(.98);transition:transform .35s ease;border:1px solid var(--paper-dark);position:relative;max-height:88dvh;overflow:auto;}
  .scrim.open .card{transform:translateY(0) scale(1);}
  .card .mk{font-family:'Courier New',monospace;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--rust);}
  .card.hiddenmem .mk{color:#7a6f5a;}
  .card h2{font-size:21px;margin:6px 0 12px;line-height:1.16;}
  .card p{font-size:15px;line-height:1.6;margin-bottom:12px;}
  .card .close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;color:var(--ink);opacity:.5;cursor:pointer;line-height:1;}
  .btn{display:block;width:100%;text-align:center;border:none;cursor:pointer;font-family:'Courier New',monospace;font-size:13px;letter-spacing:.04em;padding:13px;border-radius:5px;margin-top:8px;text-decoration:none;}
  .btn-dark{background:var(--ink);color:#f3ead6;}.btn-dark:active{background:#000;}
  .btn-rust{background:var(--rust);color:#f3ead6;}
  .btn-line{background:none;border:1px solid var(--paper-dark);color:var(--ink);}
  .keepwalking{display:block;width:100%;text-align:center;background:none;border:none;margin-top:10px;font-family:Georgia,serif;font-style:italic;font-size:13px;color:var(--rust);cursor:pointer;text-decoration:underline;}
  .choice-h{font-family:Georgia,serif;font-size:17px;line-height:1.3;margin-bottom:14px;}
  /* route map */
  .route{margin:14px 0 4px;padding:14px;background:rgba(26,23,20,.06);border:1px solid var(--paper-dark);border-radius:6px;}
  .route .step{display:flex;align-items:center;font-family:'Courier New',monospace;font-size:13px;color:var(--ink);margin:5px 0;}
  .route .dot{width:9px;height:9px;border-radius:50%;background:var(--rust);margin-right:10px;flex:none;}
  .route .arrow{color:var(--paper-dark);margin:0 0 0 3px;font-size:11px;}
  .route .found{margin-left:auto;font-size:10px;letter-spacing:.08em;color:var(--moss);}
  .toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:25;background:rgba(20,15,10,.85);color:#f3ead6;font-family:'Courier New',monospace;font-size:11px;letter-spacing:.06em;padding:7px 14px;border-radius:20px;opacity:0;transition:opacity .3s ease;pointer-events:none;border:1px solid rgba(205,191,166,.3);}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div id="root"></div>
<script>
  // If anything throws before React paints, show it instead of a black screen.
  window.addEventListener("error", function(e){
    var r=document.getElementById("root");
    if(r && !r.firstChild){
      r.innerHTML='<div style="color:#d8cbb4;font-family:Georgia,serif;padding:30px;line-height:1.5">'
        +'<p style="font-size:18px">The Manchester Maze had trouble loading.</p>'
        +'<p style="font-size:13px;opacity:.7">'+(e.message||"")+'</p>'
        +'<p style="font-size:13px;opacity:.7">Try refreshing, or check your connection \u2014 the game loads a few libraries from the web.</p></div>';
    }
  });
</script>

picture house", "img": "roxy", "start": {"x": 30, "y": 80}, "spots": [{"id": "doors", "x": 50, "y": 64, "label": "The front doors", "kicker": "saturday matinee", "title": "The Roxy was the only quiet you got.", "body": ["Dark room, big screen, nobody asking anything of you for two hours. The closest thing to peace there was.", "Out here you masked all day. In there you didn't have to be anyone."], "moods": {"crew": {"kicker": "rolling deep", "title": "You came mob-handed.", "body": ["Ten of you through the doors, loud, taking up space because together you could. On your own you'd have kept your head down.", "The crew gave you cover. It also meant you were never really still, never really yourself."]}}}, {"id": "wall", "x": 80, "y": 70, "label": "The side wall", "kicker": "the crew", "title": "The lads gathered on the side wall.", "body": ["Belonging had a price and you paid it without thinking. Being in the crew kept you safe and got you into trouble in equal measure.", "Some of those lads never made it out. You think about that a lot."]}], "hidden": {"id": "poster", "x": 18, "y": 60, "label": "The poster case", "kicker": "hidden · other worlds", "title": "You read every poster twice.", "body": ["Films set anywhere but here. Places with no estate, no wall, no big lads. You memorised them like maps out.", "Stories were the first escape route you ever found."]}, "choices": {"prompt": "Pictures are over. Step outside.", "options": [{"label": "Out onto the main road", "to": "roxystreet", "mood": "crew"}]}}, "roxystreet": {"place": "Roxy Road", "chapter": "3 · Out on the main road", "img": "roxystreet", "start": {"x": 78, "y": 82}, "spots": [{"id": "crossing", "x": 58, "y": 70, "label": "The crossing", "kicker": "the edge of the manor", "title": "The main road was the border.", "body": ["One side was everything you knew. The other side was everywhere you didn't. You stood on that kerb a lot, working up to crossing.", "Every way out starts with a road you're scared to cross."]}, {"id": "lights", "x": 40, "y": 58, "label": "The traffic lights", "kicker": "waiting for green", "title": "You learned to wait for your moment.", "body": ["Cross too early and you'd get clipped. Too late and you'd miss it. Reading the timing was second nature by the time you were ten.", "Patience wasn't your strong suit — except when it mattered. Then you had it in spades."]}], "hidden": {"id": "corner", "x": 16, "y": 66, "label": "The far corner", "kicker": "hidden · where the buses went", "title": "You watched the buses pull away.", "body": ["Every one of them going somewhere that wasn't here. You clocked the destinations like a kid reading a treasure map.", "One day you'd be on one. You promised yourself that on this corner more than once."]}, "choices": {"prompt": "Older now. Town pulls one way, the estate the other.", "options": [{"label": "Back toward school", "to": "schoolyard", "mood": "crew"}]}}, "precinct": {"place": "The Precinct", "chapter": "2 · The shops", "img": "precinct", "start": {"x": 30, "y": 82}, "spots": [{"id": "shops", "x": 40, "y": 52, "label": "The row of shops", "kicker": "tick and tally", "title": "Everyone owed the shop something.", "body": ["The corner shop ran on tick and trust. You learned how money worked here — mostly by watching how it didn't.", "It's where the businessman in you started, though it'd take decades to show up."], "moods": {"alone": {"kicker": "watching, always", "title": "On your own, you noticed everything.", "body": ["Who paid, who ducked in and out quick, who the shopkeeper watched. Alone you weren't lonely — you were learning.", "Reading a room was survival. Turns out it's also half of business."]}}}, {"id": "wall", "x": 70, "y": 66, "label": "The low wall", "kicker": "killing time", "title": "You spent hours on that wall.", "body": ["Nothing to do and nowhere to be. Boredom on an estate is its own kind of danger.", "Idle hands found trouble. You found plenty."]}], "hidden": {"id": "phonebox", "x": 86, "y": 74, "label": "The phone box", "kicker": "hidden · the lifeline", "title": "That phone box was the whole world.", "body": ["A line out of the estate, if you had the coins. You'd watch people make calls that changed their week.", "Everyone was trying to reach somewhere else. You were no different."]}, "choices": {"prompt": "Morning comes. Where to?", "options": [{"label": "Up to school", "to": "schoolyard", "mood": "alone"}]}}, "schoolyard": {"place": "The Schoolyard", "chapter": "4 · The open yard", "img": "schoolyard", "start": {"x": 50, "y": 84}, "spots": [{"id": "yard", "x": 55, "y": 62, "label": "The yard", "kicker": "too much, all at once", "title": "The yard was a wall of noise.", "body": ["Hundreds of kids, all moving, all shouting, nothing you could filter out. You'd find an edge and press your back to it.", "Other kids saw a playground. You saw a system with no off switch."]}, {"id": "tower", "x": 34, "y": 34, "label": "The tower", "kicker": "the high window", "title": "You always found the quiet corner.", "body": ["Up by the old tower, round the back, anywhere the crowd thinned out. You needed it the way other kids needed the game.", "Nobody taught you to self-regulate. You worked it out one quiet corner at a time."]}], "hidden": {"id": "tree", "x": 80, "y": 76, "label": "The little tree", "kicker": "hidden · something growing", "title": "You watched that scrawny tree for years.", "body": ["Planted thin and bent, no business surviving an estate. But it held on, season after season.", "You knew how it felt. You held on too."]}, "choices": {"prompt": "The bell goes. Inside now.", "options": [{"label": "Into the school", "to": "school", "mood": "alone"}]}}, "school": {"place": "The School", "chapter": "5 · The place you didn't fit", "img": "school", "start": {"x": 50, "y": 82}, "spots": [{"id": "yard", "x": 60, "y": 56, "label": "The corridor", "kicker": "the bell", "title": "School was a maze with no map.", "body": ["Rules that made no sense, noise you couldn't filter, a body that wouldn't sit still. They called it bad behaviour. It was an undiagnosed brain doing its best.", "Nobody saw the autism or the ADHD. They just saw a problem kid."]}, {"id": "tower", "x": 28, "y": 40, "label": "The classroom", "kicker": "the daydream", "title": "You lived in your own head.", "body": ["When the room was too much you went somewhere else — a story, a plan, a world you ran yourself.", "That escape hatch felt like a weakness then. Turns out it was the engine."]}], "hidden": {"id": "gate", "x": 84, "y": 70, "label": "The gate", "kicker": "hidden · counting down", "title": "You watched that gate like a clock.", "body": ["Home time. The one fixed point in a day that made no sense. You could feel the minutes to it in your chest.", "You were always counting down to the next bit of freedom. Still are, if you're honest."]}, "choices": {"prompt": "School's behind you now. Where next?", "options": [{"label": "To the church for some quiet", "to": "church", "mood": "alone"}, {"label": "Out with the older lads", "to": "caravan", "mood": "crew"}]}}, "church": {"place": "The Church", "chapter": "6 · A bit of stillness", "img": "church", "start": {"x": 50, "y": 82}, "spots": [{"id": "doors", "x": 56, "y": 58, "label": "The doors", "kicker": "not religion", "title": "It wasn't God you came for.", "body": ["It was the quiet. The cold stone, the empty pews, nobody wanting anything. A place that asked nothing of you.", "You'd take stillness wherever you could find it. There wasn't much of it going round."], "moods": {"alone": {"kicker": "just you and the quiet", "title": "Alone in here felt like the only honest place.", "body": ["No mask needed. No crew to read. The quiet didn't expect you to be anything.", "You came on your own and that was the point. Some peace you can only find by yourself."]}}}, {"id": "spire", "x": 40, "y": 26, "label": "The spire", "kicker": "looking up", "title": "You always looked for the way up.", "body": ["Even as a kid you measured the distance between where you were and where you wanted to be.", "The maze had an exit. You just couldn't see it yet."]}], "hidden": {"id": "bench", "x": 16, "y": 70, "label": "The bench", "kicker": "hidden · sitting with it", "title": "You sat on that bench for hours.", "body": ["Not praying. Just sitting, letting the noise in your head settle to something you could hear over.", "Learning to sit with yourself was a skill nobody taught you. You taught it to yourself, here."]}, "choices": {"prompt": "Years pass. The pull is stronger now.", "options": [{"label": "Into the rave years", "to": "caravan", "mood": "crew"}]}}, "caravan": {"place": "The Caravan", "chapter": "7 · The rave years", "img": "caravan", "start": {"x": 50, "y": 86}, "spots": [{"id": "window", "x": 30, "y": 52, "label": "The window", "kicker": "found family", "title": "The scene gave you something the estate never did.", "body": ["For the first time, a room full of people who didn't want you to be anyone but yourself. Music, belonging, a whole new tribe.", "Rave culture saved a part of you. It also nearly took the rest."], "moods": {"crew": {"kicker": "all in, both feet", "title": "You went in deeper than anyone.", "body": ["When the crew chased the scene, you chased it hardest. All or nothing was the only setting you had.", "The same intensity that nearly sank you is the one that builds everything now. Same engine, different track."]}}}, {"id": "door", "x": 64, "y": 48, "label": "The door", "kicker": "the other side", "title": "Every high had a door at the back.", "body": ["Addiction doesn't arrive announcing itself. It arrives as the best thing that ever happened to you.", "Getting back out of that one was the hardest turn in the whole maze."]}], "hidden": {"id": "tent", "x": 12, "y": 70, "label": "The tent", "kicker": "hidden · the morning after", "title": "Mornings were the honest part.", "body": ["When the music stopped and the field went quiet, you saw it for what it was. Then night came and you forgot again.", "The truth was always there in the daylight. Took you a long time to stop looking away."]}, "choices": {"prompt": "You can't stay here. There's only one way left.", "options": [{"label": "Find the way out for good", "to": "airport", "mood": "alone"}]}}, "airport": {"place": "The Way Out", "chapter": "8 · Departures", "img": "airport", "start": {"x": 70, "y": 84}, "spots": [{"id": "plane", "x": 50, "y": 46, "label": "The plane", "kicker": "first time flying", "title": "The kid from the estate got on a plane.", "body": ["Suit on, terrified, grinning. Nobody on that estate would have bet on this. You barely bet on it yourself.", "You found the exit. Not in one leap — in a thousand small turns."]}, {"id": "self", "x": 76, "y": 62, "label": "You, stood there", "kicker": "the diagnosis", "title": "The word came late, and it changed everything.", "body": ["Autism. ADHD. A lifetime suddenly made sense — the masking, the escape hatches, the way you read every room.", "It wasn't a label. It was a map of the maze you'd been walking blind."]}], "hidden": {"id": "case", "x": 22, "y": 72, "label": "The suitcase", "kicker": "hidden · what you packed", "title": "Everything you carried out fit in one bag.", "body": ["Not much in the case. Everything that mattered you carried in your head — the reading, the watching, the engine that wouldn't quit.", "Turns out you'd been packing for this your whole life."]}, "ending": {"kicker": "You found your way out", "title": "That's the maze. The whole of it's in the book.", "body": "The estate, the crew, the rave years, the diagnosis that explained a life — and the way out. You've walked the shape of it. The full story is The Manchester Maze.", "pitches": {"crew": "You ran with the crew and felt how belonging can cost you. Read how he found his own way out.", "alone": "You walked it on your own and felt the weight of not fitting. Read what the diagnosis finally explained.", "default": "You've walked the shape of it. Read the full story."}}}}};
  window.AMAZON = "https://amzn.eu/d/0iXJTKHE";
</script>
<script type="text/babel" data-presets="react" data-type="script">
const {useState,useRef,useEffect,useCallback} = React;
const IMAGES = window.IMAGES;
const STORY = window.STORY;
const AMAZON = window.AMAZON;

function Avatar({pos,walking,fx,fy}){
  return (
    <div className={"avatar"+(walking?" walking":"")} style={{left:fx(pos.x)+"%",top:fy(pos.y)+"%"}}>
      <div className="nametag">Chris</div>
      <div className="body"><div className="hair"></div><div className="head"></div><div className="torso"></div><div className="stripe"></div><div className="legs"></div><div className="shadow"></div></div>
    </div>
  );
}

// apply the arriving mood to a spot's memory text
function moodApplied(spot, mood){
  if(spot.moods && mood && spot.moods[mood]){
    return {...spot, ...spot.moods[mood]};
  }
  return spot;
}

function App(){
  const [sceneId,setSceneId] = useState(STORY.start);
  const [mood,setMood] = useState(null);            // how you arrived
  const scene = STORY.scenes[sceneId];
  // measured photo rectangle (object-fit:contain) as % of stage
  const [fit,setFit] = useState({left:0,top:0,w:100,h:100});
  const imgRef = useRef(null);
  const stageRef = useRef(null);
  const measureFit = useCallback(()=>{
    const img = imgRef.current, st = stageRef.current;
    if(!img||!st||!img.naturalWidth) return;
    const sw=st.clientWidth, sh=st.clientHeight;
    const ar=img.naturalWidth/img.naturalHeight, sar=sw/sh;
    let w,h;
    if(ar>sar){ w=sw; h=sw/ar; } else { h=sh; w=sh*ar; }
    setFit({ left:(sw-w)/2/sw*100, top:(sh-h)/2/sh*100, w:w/sw*100, h:h/sh*100 });
  },[]);
  useEffect(()=>{ measureFit(); window.addEventListener("resize",measureFit); return ()=>window.removeEventListener("resize",measureFit); },[measureFit,sceneId]);
  // convert a photo-% coord to stage-% coord
  const fx = (x)=> fit.left + x/100*fit.w;
  const fy = (y)=> fit.top  + y/100*fit.h;
  const [pos,setPos] = useState(scene.start);
  const [walking,setWalking] = useState(false);
  const [active,setActive] = useState(null);
  const [done,setDone] = useState({});
  const [hiddenDone,setHiddenDone] = useState({});  // hidden found per scene id
  const [near,setNear] = useState(false);           // avatar near hidden spot
  const [showChoice,setShowChoice] = useState(false);
  const [fading,setFading] = useState(false);
  const [route,setRoute] = useState([{id:STORY.start, found:0, total:STORY.scenes[STORY.start].spots.length}]);
  const [toast,setToast] = useState("");
  const target = useRef(null), held = useRef(null), raf = useRef(null);

  const total = scene.spots.length;
  const visited = scene.spots.filter(s=>done[s.id]).length;
  const foundSecret = !!hiddenDone[sceneId];

  const showToast = (t)=>{ setToast(t); setTimeout(()=>setToast(""),1800); };

  const goScene = useCallback((id, m)=>{
    setFading(true);
    setTimeout(()=>{
      const ns = STORY.scenes[id];
      setSceneId(id); setMood(m||null); setPos(ns.start);
      setDone({}); setActive(null); setShowChoice(false); setNear(false);
      target.current=null; held.current=null; setWalking(false);
      setRoute(r=>[...r, {id, found:0, total:ns.spots.length}]);
      setTimeout(()=>setFading(false),60);
    },520);
  },[]);

  const checkSpots = useCallback((p)=>{
    // main spots
    for(const s of scene.spots){
      if(!done[s.id] && Math.hypot(s.x-p.x, s.y-p.y) < 7){
        setActive(moodApplied(s, mood));
        setDone(prev=>({...prev,[s.id]:true}));
        setRoute(r=>r.map((step,i)=> i===r.length-1 ? {...step, found:step.found+1} : step));
        target.current=null; setWalking(false);
        return;
      }
    }
    // hidden spot proximity + discovery
    const h = scene.hidden;
    if(h){
      const d = Math.hypot(h.x-p.x, h.y-p.y);
      setNear(d < 13);
      if(d < 7 && !hiddenDone[sceneId]){
        setActive({...h, _hidden:true});
        setHiddenDone(prev=>({...prev,[sceneId]:true}));
        showToast("Hidden memory found");
        target.current=null; setWalking(false);
      }
    }
  },[done,scene,mood,hiddenDone,sceneId]);

  useEffect(()=>{
    const step=()=>{
      setPos(prev=>{
        let np=prev;
        if(target.current){
          const dx=target.current.x-prev.x, dy=target.current.y-prev.y, dist=Math.hypot(dx,dy);
          if(dist<0.8){target.current=null;setWalking(false);np=prev;}
          else{const sp=0.85;np={x:prev.x+dx/dist*sp,y:prev.y+dy/dist*sp};}
        } else if(held.current){
          const v=0.95; let nx=prev.x,ny=prev.y;
          if(held.current==="up")ny-=v; if(held.current==="down")ny+=v;
          if(held.current==="left")nx-=v; if(held.current==="right")nx+=v;
          nx=Math.max(4,Math.min(96,nx)); ny=Math.max(8,Math.min(94,ny));
          np={x:nx,y:ny};
        }
        if(np!==prev) checkSpots(np);
        return np;
      });
      raf.current=requestAnimationFrame(step);
    };
    raf.current=requestAnimationFrame(step);
    return ()=>cancelAnimationFrame(raf.current);
  },[checkSpots]);

  const closeMemory=()=>{
    const wasHidden = active && active._hidden;
    setActive(null);
    if(!wasHidden && visited>=total){ setTimeout(()=>setShowChoice(true),300); }
  };

  const tapMove=(e)=>{
    if(active||showChoice) return;
    const r=e.currentTarget.getBoundingClientRect();
    const cx=("touches"in e?e.touches[0].clientX:e.clientX)-r.left;
    const cy=("touches"in e?e.touches[0].clientY:e.clientY)-r.top;
    // screen-% then invert the contain-fit mapping into photo-%
    const sx=(cx/r.width)*100, sy=(cy/r.height)*100;
    let x=(sx-fit.left)/fit.w*100, y=(sy-fit.top)/fit.h*100;
    x=Math.max(4,Math.min(96,x)); y=Math.max(8,Math.min(94,y));
    target.current={x,y}; setWalking(true);
  };
  const press=(dir)=>{held.current=dir;target.current=null;setWalking(true);};
  const release=()=>{held.current=null;setWalking(false);};

  const isEnding = !!scene.ending;
  const placeName = (id)=>STORY.scenes[id].place;
  const secretsFound = Object.keys(hiddenDone).length;

  const shareRoute = ()=>{
    const path = route.map(s=>placeName(s.id)).join("  →  ");
    const txt = "My route through The Manchester Maze:\n"+path+"\n\nA walkable memoir of growing up neurodivergent in 1980s Manchester. "+AMAZON;
    if(navigator.share){ navigator.share({title:"The Manchester Maze", text:txt, url:AMAZON}).catch(()=>{}); }
    else if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(()=>showToast("Route copied")); }
    else showToast("Route copied");
  };

  const endPitch = isEnding ? (scene.ending.pitches[mood] || scene.ending.pitches.default) : "";

  return (
    <div className="stage" ref={stageRef}>
      <img className="scene-bg" src={IMAGES[scene.img]} alt="" aria-hidden="true" />
      <img className="scene-img" ref={imgRef} src={IMAGES[scene.img]} alt={scene.place} onLoad={measureFit} />
      <div className="vignette"></div><div className="grain"></div>

      <div className="topbar">
        <div className="chapter">{scene.chapter}</div>
        <div className="titlecard"><div className="kicker">The Manchester Maze</div><div className="place">{scene.place}</div></div>
        <div className="prog">{visited}/{total}{foundSecret?" ✦":""}</div>
      </div>

      <div style={{position:"absolute",inset:0,zIndex:3}} onClick={tapMove} onTouchStart={tapMove}></div>

      {scene.spots.map(s=>(
        <div key={s.id} className={"hotspot"+(done[s.id]?" done":"")} style={{left:fx(s.x)+"%",top:fy(s.y)+"%"}}
             onClick={(e)=>{e.stopPropagation();target.current={x:s.x,y:s.y+6};setWalking(true);}}>
          <div className="ring"></div><div className="ring r2"></div><div className="core"></div>
          <div className="label">{s.label}</div>
        </div>
      ))}

      {scene.hidden && (
        <div className={"hotspot hidden"+(near?" near":"")+(hiddenDone[sceneId]?" done":"")}
             style={{left:fx(scene.hidden.x)+"%",top:fy(scene.hidden.y)+"%"}}
             onClick={(e)=>{e.stopPropagation();target.current={x:scene.hidden.x,y:scene.hidden.y+6};setWalking(true);}}>
          <div className="ring"></div><div className="core"></div>
          <div className="label">{scene.hidden.label}</div>
        </div>
      )}

      <Avatar pos={pos} walking={walking} fx={fx} fy={fy} />

      <div className="pad">
        <button className="up" onMouseDown={()=>press("up")} onMouseUp={release} onMouseLeave={release} onTouchStart={(e)=>{e.preventDefault();press("up");}} onTouchEnd={release}>▲</button>
        <button className="left" onMouseDown={()=>press("left")} onMouseUp={release} onMouseLeave={release} onTouchStart={(e)=>{e.preventDefault();press("left");}} onTouchEnd={release}>◀</button>
        <button className="right" onMouseDown={()=>press("right")} onMouseUp={release} onMouseLeave={release} onTouchStart={(e)=>{e.preventDefault();press("right");}} onTouchEnd={release}>▶</button>
        <button className="down" onMouseDown={()=>press("down")} onMouseUp={release} onMouseLeave={release} onTouchStart={(e)=>{e.preventDefault();press("down");}} onTouchEnd={release}>▼</button>
      </div>
      <div className="hint">{visited<total ? "Tap to walk · find the glowing spots · some are hidden" : "You've seen it all · choose your next turn"}</div>

      <div className={"toast"+(toast?" show":"")}>{toast}</div>

      {/* memory */}
      <div className={"scrim"+(active?" open":"")} onClick={closeMemory}>
        {active && (
          <div className={"card"+(active._hidden?" hiddenmem":"")} onClick={e=>e.stopPropagation()}>
            <button className="close" onClick={closeMemory}>×</button>
            <div className="mk">{active._hidden ? active.kicker : "Memory · "+active.kicker}</div>
            <h2>{active.title}</h2>
            {active.body.map((p,i)=><p key={i}>{p}</p>)}
            <button className="keepwalking" onClick={closeMemory}>
              {(!active._hidden && visited>=total) ? "see where the road goes →" : "keep walking"}
            </button>
          </div>
        )}
      </div>

      {/* choice / ending */}
      <div className={"scrim"+(showChoice?" open":"")}>
        {showChoice && !isEnding && (
          <div className="card" onClick={e=>e.stopPropagation()}>
            <div className="mk">A turn in the maze</div>
            <div className="choice-h">{scene.choices.prompt}</div>
            {scene.choices.options.map((o,i)=>(
              <button key={i} className="btn btn-dark" onClick={()=>goScene(o.to,o.mood)}>{o.label}</button>
            ))}
          </div>
        )}
        {showChoice && isEnding && (
          <div className="card" onClick={e=>e.stopPropagation()}>
            <div className="mk">{scene.ending.kicker}</div>
            <h2>{scene.ending.title}</h2>
            <p>{scene.ending.body}</p>
            <div className="route">
              {route.map((s,i)=>(
                <div className="step" key={i}>
                  <span className="dot"></span>{placeName(s.id)}
                  <span className="found">{s.found}/{s.total}</span>
                </div>
              ))}
            </div>
            <p style={{fontStyle:"italic",color:"var(--rust)",marginTop:"10px"}}>{endPitch}</p>
            <p style={{fontSize:"12px",opacity:.7}}>Hidden memories found: {secretsFound} of {Object.keys(STORY.scenes).length}</p>
            <a className="btn btn-rust" href={AMAZON} target="_blank" rel="noopener">Get the book on Amazon →</a>
            <button className="btn btn-dark" onClick={shareRoute}>Share my route</button>
            <button className="btn btn-line" onClick={()=>{ setRoute([{id:STORY.start,found:0,total:STORY.scenes[STORY.start].spots.length}]); setHiddenDone({}); goScene(STORY.start,null); }}>Walk the maze again</button>
          </div>
        )}
      </div>

      <div className={"fade"+(fading?" on":"")}></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
