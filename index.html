  // ============================================================
  // SCENE — the playable photo with walker
  // ============================================================
  function WalkableScene(props){
    var scene = props.scene;
    var ps = useState(scene.startPos); var pos = ps[0], setPos = ps[1];
    var ws = useState(false); var walking = ws[0], setWalking = ws[1];
    var vs = useState({}); var visited = vs[0], setVisited = vs[1];
    var ms = useState(null); var modal = ms[0], setModal = ms[1];
    var cs = useState(false); var showChoice = cs[0], setShowChoice = cs[1];
    var rs = useState([]); var ripples = rs[0], setRipples = rs[1];
    var pendingPos = useRef(null);
    var walkTimer = useRef(null);

    var totalSpots = scene.hotspots.length;
    var visitedCount = Object.keys(visited).length;
    var allFound = visitedCount >= totalSpots;

    useEffect(function(){
      // reset on scene change
      setPos(scene.startPos);
      setWalking(false);
      setVisited({});
      setModal(null);
      setShowChoice(false);
      setRipples([]);
      if(walkTimer.current) clearTimeout(walkTimer.current);
    }, [scene.bg]);

    function handlePhotoTap(e){
      if(modal || showChoice) return;
      var rect = e.currentTarget.getBoundingClientRect();
      var clientX = e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : null);
      var clientY = e.clientY != null ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : null);
      if(clientX == null) return;
      var x = ((clientX - rect.left) / rect.width) * 100;
      var y = ((clientY - rect.top) / rect.height) * 100;
      var wa = scene.walkArea;
      var cx = Math.max(wa.minX, Math.min(wa.maxX, x));
      var cy = Math.max(wa.minY, Math.min(wa.maxY, y));

      // ripple effect on tap
      var rid = Date.now();
      setRipples(function(r){ return r.concat([{ id:rid, x:x, y:y }]); });
      setTimeout(function(){
        setRipples(function(r){ return r.filter(function(rp){ return rp.id !== rid; }); });
      }, 700);

      // start walk
      setPos({ x:cx, y:cy });
      setWalking(true);
      pendingPos.current = { x:cx, y:cy };

      if(walkTimer.current) clearTimeout(walkTimer.current);
      walkTimer.current = setTimeout(function(){
        setWalking(false);
        checkHotspots(pendingPos.current);
      }, 1400);
    }

    function checkHotspots(p){
      if(!p) return;
      for(var i=0;i<scene.hotspots.length;i++){
        var hot = scene.hotspots[i];
        if(visited[hot.id]) continue;
        var dx = p.x - hot.x;
        var dy = p.y - hot.y;
        var dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < 12){
          // hit it
          var newVisited = Object.assign({}, visited);
          newVisited[hot.id] = true;
          setVisited(newVisited);
          var newCount = Object.keys(newVisited).length;
          setModal({
            label: hot.label,
            memory: hot.memory,
            last: newCount >= totalSpots
          });
          return;
        }
      }
    }

    function closeModal(){
      var wasLast = modal && modal.last;
      setModal(null);
      if(wasLast){
        // all spots done
        setTimeout(function(){
          if(scene.ending === 'choose'){
            setShowChoice(true);
          } else if(scene.ending === 'go'){
            props.onNext(scene.next);
          } else if(scene.ending === 'final'){
            props.onNext('__final__');
          }
        }, 400);
      }
    }

    function handleChoice(next){
      setShowChoice(false);
      props.onNext(next);
    }

    return h('div', { style:{
      position:'relative', minHeight:'100vh',
      backgroundColor:C.bg, overflow:'hidden'
    }},
      // HUD - top bar
      h('div', { style:{
        position:'fixed', top:0, left:0, right:0, zIndex:30,
        padding:'10px 16px',
        backgroundColor:'rgba(13,12,10,0.92)',
        borderBottom:'1px solid '+C.concrete
      }},
        h('div', { style:{ maxWidth:'28rem', margin:'0 auto', display:'flex',
          alignItems:'center', justifyContent:'space-between', gap:'10px' }},
          h('div', null,
            h('div', { style:{
              fontSize:'8px', letterSpacing:'0.3em',
              fontFamily:FONT_BODY, color:C.sodium
            }}, scene.chapter),
            h('div', { style:{
              fontSize:'0.85rem', letterSpacing:'0.1em',
              fontFamily:FONT_DISPLAY, color:C.paper, lineHeight:1.1
            }}, scene.place)
          ),
          h('div', { style:{ textAlign:'right' }},
            h('div', { style:{
              fontSize:'8px', letterSpacing:'0.3em',
              fontFamily:FONT_BODY, color:C.paperDim
            }}, 'MEMORIES'),
            h('div', { style:{
              fontFamily:FONT_DISPLAY, fontSize:'1.1rem',
              color: allFound ? C.sodium : C.paper, lineHeight:1
            }}, visitedCount + ' / ' + totalSpots)
          )
        )
      ),

      // The walkable photo — natural aspect ratio, centered, lad walks the whole thing
      h('div', { style:{
        minHeight:'100vh', paddingTop:'56px',
        display:'flex', alignItems:'center', justifyContent:'center',
        overflow:'hidden'
      }},
        h('div', { style:{
          position:'relative', display:'inline-block',
          maxWidth:'100vw', maxHeight:'calc(100vh - 60px)',
          lineHeight:0
        }},
          h('img', {
            src: IMG[scene.bg], alt:'', onClick: handlePhotoTap,
            style:{
              display:'block',
              maxWidth:'100vw',
              maxHeight:'calc(100vh - 60px)',
              cursor:'pointer',
              filter:'contrast(1.05) saturate(0.9)',
              userSelect:'none'
            }
          }),
          // dark overlay on top of photo
          h('div', { style:{
            position:'absolute', inset:0,
            background:'linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.25) 100%)',
            pointerEvents:'none'
          }}),

          // Visited spots (small markers)
          scene.hotspots.map(function(hot){
            return visited[hot.id] ? h(VisitedSpot, { key:hot.id, hot:hot }) : null;
          }),

          // Active hotspots (glowing)
          scene.hotspots.map(function(hot){
            return !visited[hot.id] ? h(Hotspot, { key:'h'+hot.id, hot:hot, visited:false }) : null;
          }),

          // Ripples on tap
          ripples.map(function(r){ return h(Ripple, { key:r.id, id:r.id, x:r.x, y:r.y }); }),

          // The avatar (positioned within the photo, walks the whole image)
          h(Avatar, { pos: pos, walking: walking }),

          // Tap hint (overlay on photo)
          !walking && visitedCount === 0 && h('div', {
            style:{
              position:'absolute', bottom:'12px', left:'50%',
              transform:'translateX(-50%)',
              backgroundColor:'rgba(13,12,10,0.88)',
              color:C.sodium, fontFamily:FONT_BODY,
              fontSize:'0.75rem', letterSpacing:'0.2em',
              padding:'8px 14px',
              border:'1px solid '+C.concrete,
              animation:'flicker 1.6s infinite',
              pointerEvents:'none',
              whiteSpace:'nowrap'
            }
          }, '→ TAP ANYWHERE TO WALK ←')
        )
      ),

      modal && h(MemoryModal, {
        label: modal.label, memory: modal.memory,
        last: modal.last, onClose: closeModal
      }),

      showChoice && h(ChoicePrompt, {
        choices: scene.choices, onChoose: handleChoice
      })
    );
  }

  // ============================================================
  // TITLE
  // ============================================================
  function Title(props){
    return h('div', {
      style:{
        minHeight:'100vh', display:'flex', flexDirection:'column',
        alignItems:'center', justifyContent:'center',
        padding:'40px 24px', position:'relative'
      }},
      h('div', {
        style:{
          position:'absolute', inset:0, zIndex:0,
          backgroundImage:'url('+IMG.estate+')',
          backgroundSize:'cover', backgroundPosition:'center',
          filter:'brightness(0.35) contrast(1.1) sepia(0.15)'
        }}),
      h('div', { style:{ maxWidth:'28rem', width:'100%', textAlign:'center', position:'relative', zIndex:10 }},
        h('div', { style:{
          fontSize:'12px', letterSpacing:'0.3em', marginBottom:'24px',
          fontFamily:FONT_BODY, color:C.paperDim
        }}, '░░ WALK IT ░░'),
        h('h1', { style:{
          fontFamily:FONT_DISPLAY, fontSize:'clamp(3rem, 13vw, 5.5rem)',
          color:C.paper, letterSpacing:'0.02em', lineHeight:0.95,
          marginTop:0, marginBottom:'8px',
          textShadow:'4px 4px 0 '+C.blood
        }}, 'THE', h('br'), 'MANCHESTER', h('br'), 'MAZE'),
        h('div', { style:{
          margin:'30px 0', height:'1px', width:'100%',
          background:'linear-gradient(90deg, transparent, '+C.sodium+', transparent)'
        }}),
        h('p', { style:{
          fontFamily:FONT_BODY, fontSize:'1rem',
          color:C.paper, marginBottom:'8px', lineHeight:1.5
        }}, 'Walk the actual places.'),
        h('p', { style:{
          fontFamily:FONT_BODY, fontSize:'1rem',
          color:C.paperDim, marginBottom:'36px', lineHeight:1.5, fontStyle:'italic'
        }}, 'Find the glowing memories. Choose your path.'),
        h('button', { onClick: props.onStart,
          style:{
            padding:'16px 32px',
            backgroundColor:C.sodium, color:C.ink,
            fontFamily:FONT_DISPLAY, fontSize:'1.4rem',
            letterSpacing:'0.1em',
            border:'2px solid '+C.paper,
            boxShadow:'5px 5px 0 '+C.blood
          }}, 'ENTER THE MAZE →'),
        h('div', { style:{
          marginTop:'40px', fontSize:'10px', letterSpacing:'0.3em',
          fontFamily:FONT_BODY, color:C.paperDim
        }}, 'BASED ON THE MEMOIR BY',
          h('br'),
          h('span', { style:{ color:C.sodium, fontFamily:FONT_DISPLAY,
            fontSize:'1rem', letterSpacing:'0.15em' }},
            'CHRISTOPHER RYAN LEECE')
        ),
        h('div', { style:{
          marginTop:'24px', fontSize:'9px', letterSpacing:'0.2em',
          fontFamily:FONT_BODY, color:C.paperDim, opacity:0.6, maxWidth:'18rem', margin:'24px auto 0'
        }}, 'NAMES, PLACES & EVENTS FICTIONALISED. CONTAINS REFERENCES TO VIOLENCE & DRUG USE.')
      )
    );
  }

  // ============================================================
  // APP
  // ============================================================
  function App(){
    var ss = useState('title'); var stage = ss[0], setStage = ss[1];
    var ks = useState('estate'); var sceneKey = ks[0], setSceneKey = ks[1];
    var is = useState(true); var showIntro = is[0], setShowIntro = is[1];

    function start(){
      setSceneKey('estate');
      setStage('playing');
      setShowIntro(true);
      window.scrollTo(0, 0);
    }

    function goToScene(key){
      if(key === '__final__'){
        setStage('ending');
        window.scrollTo(0, 0);
        return;
      }
      setSceneKey(key);
      setShowIntro(true);
      window.scrollTo(0, 0);
      // If this is an ending scene with final ending type, the scene itself will trigger
      var s = SCENES[key];
      if(s && s.ending === 'final'){
        // play it normally but ending will route to ending screen
      }
    }

    function dismissIntro(){
      setShowIntro(false);
    }

    function restart(){
      setStage('title');
      setSceneKey('estate');
      setShowIntro(true);
      window.scrollTo(0, 0);
    }

    if(stage === 'title'){
      return h(Title, { onStart: start });
    }
    if(stage === 'ending'){
      var endScene = SCENES[sceneKey];
      return h(Ending, { scene: endScene, onRestart: restart });
    }
    var scene = SCENES[sceneKey];
    if(!scene){
      return h('div', { style:{ padding:'40px', color:C.paper }}, 'Scene missing: ' + sceneKey);
    }
    return h(React.Fragment, null,
      h(WalkableScene, { scene: scene, onNext: goToScene }),
      showIntro && h(SceneIntro, { scene: scene, onContinue: dismissIntro })
    );
  }

  function mount(){
    try {
      var root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(h(App));
      var loading = document.getElementById('loading');
      if(loading) loading.classList.add('hide');
    } catch(err) {
      var box = document.getElementById('errbox');
      if(box){
        box.style.display = 'block';
        box.textContent = 'Mount error: ' + err.message + '\n' + (err.stack || '');
      }
    }
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', mount);
  } else {
    mount();
  }
})();
</script>
</body>
</html>
