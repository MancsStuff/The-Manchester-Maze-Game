<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #1a1815;
    color: #e8dfce;
    font-family: 'Special Elite', monospace;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #root { min-height: 100vh; }
  button { font-family: inherit; cursor: pointer; }
  a { color: inherit; }
  /* Hide scrollbars on mobile */
  ::-webkit-scrollbar { width: 0; background: transparent; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.96; }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-6px) rotate(-0.3deg); }
    30% { transform: translateX(6px) rotate(0.3deg); }
    45% { transform: translateX(-4px); }
    60% { transform: translateX(4px); }
    75% { transform: translateX(-2px); }
  }
  @keyframes introFall {
    0% { transform: scale(1.15) translateY(-20px); opacity: 0; }
    30% { opacity: 1; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  @keyframes introSettle {
    0% { transform: scale(1) translateY(0); }
    100% { transform: scale(1.04) translateY(0); }
  }
  @keyframes transitionTextFade {
    0% { opacity: 0; }
    25% { opacity: 1; }
    75% { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes pickupSlide {
    0% { opacity: 0; transform: translateX(-50%) translateY(-12px); }
    15% { opacity: 1; transform: translateX(-50%) translateY(0); }
    85% { opacity: 1; transform: translateX(-50%) translateY(0); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-12px); }
  }

  /* Loading screen */
  #loading {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #1a1815;
    z-index: 9999;
    transition: opacity 0.5s ease-out;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
  #loading h1 {
    font-family: 'Anton', Impact, sans-serif;
    font-size: 3rem;
    color: #e8dfce;
    text-shadow: 3px 3px 0 #7d1f1c;
    letter-spacing: 0.02em;
    margin: 0;
    text-align: center;
    line-height: 0.95;
  }
  #loading .dots {
    margin-top: 2rem;
    color: #e89345;
    letter-spacing: 0.5em;
    font-size: 0.9rem;
    animation: flicker 1.2s infinite;
  }
</style>

function computeEnding(stats, finalChoice) {
  const { self = 0, mask = 0, outside = 0 } = stats;
  if (finalChoice === 'south_choice') {
    if (outside > self + 3) return 'razor';
    if (mask > self + 2) return 'mask';
    return 'south';
  }
  if (finalChoice === 'razor_choice') {
    if (self > outside + 3) return 'south';
    return 'razor';
  }
  if (finalChoice === 'mask_choice') {
    if (outside > mask + 2) return 'razor';
    if (self > mask + 3) return 'south';
    return 'mask';
  }
  const max = Math.max(self, mask, outside);
  if (max === outside) return 'razor';
  if (max === mask) return 'mask';
  return 'south';
}

function ThreeMazeTransition({ text, onComplete, duration = 2800 }) {
  const mountRef = useRef(null);

  useEffect(() => {
    const mount = mountRef.current;
    if (!mount) return;
    // If Three.js failed to load or WebGL is unavailable, skip the 3D scene
    // instead of crashing the whole game.
    if (typeof THREE === 'undefined') return;
    try {

    const w = mount.clientWidth, h = mount.clientHeight;
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0a0908, 4, 22);
    const camera = new THREE.PerspectiveCamera(70, w / h, 0.1, 100);
    camera.position.set(0, 1.6, 0);
    camera.lookAt(0, 1.6, -5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(w, h);
    renderer.setClearColor(0x0a0908, 1);
    mount.appendChild(renderer.domElement);

    const wallMat = new THREE.MeshStandardMaterial({ color: 0x4a443c, roughness: 0.9 });
    const wallMatLight = new THREE.MeshStandardMaterial({ color: 0x5a5448, roughness: 0.85 });
    const blockGeom = new THREE.BoxGeometry(1.4, 2.6, 1.4);

    for (let i = 0; i < 30; i++) {
      const z = -i * 1.6 - 1;
      const left = new THREE.Mesh(blockGeom, i % 2 === 0 ? wallMat : wallMatLight);
      left.position.set(-1.6, 1.3, z);
      scene.add(left);
      const right = new THREE.Mesh(blockGeom, i % 3 === 0 ? wallMat : wallMatLight);
      right.position.set(1.6, 1.3, z);
      scene.add(right);
    }

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 100),
      new THREE.MeshStandardMaterial({ color: 0x2a2520, roughness: 1.0 }));
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(0, 0, -40);
    scene.add(floor);

    const lamps = [];
    for (let i = 0; i < 8; i++) {
      const lamp = new THREE.PointLight(0xe89345, 1.4, 6, 2);
      lamp.position.set(0, 2.5, -i * 4 - 2);
      scene.add(lamp);
      lamps.push(lamp);
    }
    scene.add(new THREE.AmbientLight(0x222222, 0.3));

    const figureGroup = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0a0908, roughness: 1.0 });
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 12), bodyMat);
    head.position.y = 1.45;
    figureGroup.add(head);
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.7, 0.25), bodyMat);
    body.position.y = 0.95;
    figureGroup.add(body);
    const legL = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.6, 0.14), bodyMat);
    legL.position.set(-0.1, 0.35, 0);
    figureGroup.add(legL);
    const legR = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.6, 0.14), bodyMat);
    legR.position.set(0.1, 0.35, 0);
    figureGroup.add(legR);
    figureGroup.position.set(0, 0, -3);
    figureGroup.rotation.y = Math.PI;
    scene.add(figureGroup);

    let startTime = performance.now();
    let raf;
    const animate = (now) => {
      const elapsed = (now - startTime) / 1000;
      const t = Math.min(elapsed / (duration / 1000), 1);
      camera.position.z = -t * 18;
      figureGroup.position.z = camera.position.z - 4 - Math.sin(elapsed * 4) * 0.05;
      const stride = Math.sin(elapsed * 8) * 0.3;
      legL.rotation.x = stride;
      legR.rotation.x = -stride;
      figureGroup.position.y = Math.abs(Math.sin(elapsed * 8)) * 0.04;
      lamps.forEach((lamp, i) => {
        lamp.intensity = 1.2 + Math.sin(elapsed * 6 + i) * 0.3 + (Math.random() - 0.5) * 0.2;
      });
      renderer.render(scene, camera);
      if (t < 1) raf = requestAnimationFrame(animate);
    };
    raf = requestAnimationFrame(animate);

    const completeTimer = setTimeout(onComplete, duration);
    const skipHandler = () => onComplete();
    document.addEventListener('click', skipHandler);
    const onResize = () => {
      if (!mount) return;
      const newW = mount.clientWidth, newH = mount.clientHeight;
      camera.aspect = newW / newH;
      camera.updateProjectionMatrix();
      renderer.setSize(newW, newH);
    };
    window.addEventListener('resize', onResize);

    return () => {
      cancelAnimationFrame(raf);
      clearTimeout(completeTimer);
      document.removeEventListener('click', skipHandler);
      window.removeEventListener('resize', onResize);
      try { mount.removeChild(renderer.domElement); } catch(e) {}
      renderer.dispose();
    };
    } catch (err) {
      // 3D scene failed (WebGL/library issue) — skip the walking transition
      // so the story continues instead of freezing.
      console.error('3D transition skipped:', err);
      const t = setTimeout(onComplete, 200);
      return () => clearTimeout(t);
    }
  }, [onComplete, duration]);

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 40, backgroundColor: '#000' }}>
      <div ref={mountRef} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%' }}/>
      <div style={{ position: 'absolute', left: 0, right: 0, top: '33%', textAlign: 'center', padding: '0 24px',
        pointerEvents: 'none', zIndex: 10,
        fontFamily: FONT_BODY, color: C.paperDim, fontSize: '0.95rem', letterSpacing: '0.08em',
        textShadow: '0 2px 8px rgba(0,0,0,0.9)', opacity: 0,
        animation: `transitionTextFade ${duration}ms ease-in-out forwards` }}>
        {text || 'Walking on...'}
      </div>
      <div style={{ position: 'absolute', bottom: '24px', left: 0, right: 0, textAlign: 'center',
        fontSize: '10px', letterSpacing: '0.3em', opacity: 0.5, pointerEvents: 'none', zIndex: 10,
        fontFamily: FONT_BODY, color: C.paperDim }}>
        TAP TO SKIP
      </div>
      <Vignette/>
    </div>
  );
}

function TimerBar({ seconds, onTimeout, paused }) {
  const [remaining, setRemaining] = useState(seconds);
  useEffect(() => {
    if (paused) return;
    if (remaining <= 0) { onTimeout(); return; }
    const t = setTimeout(() => setRemaining((r) => r - 0.1), 100);
    return () => clearTimeout(t);
  }, [remaining, paused, onTimeout]);
  const pct = Math.max(0, (remaining / seconds) * 100);
  const danger = pct < 35;
  return (
    <div style={{ marginBottom: '16px' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center',
        fontSize: '10px', marginBottom: '4px', fontFamily: FONT_BODY }}>
        <span style={{ color: danger ? C.rust : C.sodium, letterSpacing: '0.2em' }}>
          {danger ? '⚠  DECIDE NOW' : '· THINK FAST ·'}
        </span>
        <span style={{ color: danger ? C.rust : C.paperDim }}>{Math.max(0, remaining).toFixed(1)}s</span>
      </div>
      <div style={{ height: '4px', backgroundColor: C.bgPanel }}>
        <div style={{ height: '100%', width: `${pct}%`, backgroundColor: danger ? C.blood : C.sodium, transition: 'all 100ms' }}/>
      </div>
    </div>
  );
}

}

function Scene({ scene, onChoose, sceneIndex, totalScenes }) {
  const [revealed, setRevealed] = useState(false);
  const [selectedIdx, setSelectedIdx] = useState(null);
  const [shake, setShake] = useState(false);

  useEffect(() => {
    setRevealed(false);
    setSelectedIdx(null);
    const t = setTimeout(() => setRevealed(true), 100);
    return () => clearTimeout(t);
  }, [scene.id]);

  function handleChoose(choice, idx) {
    if (selectedIdx !== null) return;
    setSelectedIdx(idx);
    if (choice.effects && choice.effects.intense) {
      setShake(true);
      setTimeout(() => setShake(false), 500);
    }
    setTimeout(() => onChoose(choice), 850);
  }
  function handleTimeout() {
    if (selectedIdx !== null) return;
    const idx = scene.timeoutChoice != null ? scene.timeoutChoice : 0;
    handleChoose(scene.choices[idx], idx);
  }

  return (
    <div style={{ minHeight: '100vh', padding: '64px 24px 40px', position: 'relative', zIndex: 10,
      animation: shake ? 'shake 0.4s ease-out' : 'none' }}>
      <PhotoBackground src={scene.bg ? IMG[scene.bg] : null} opacity={0.18}/>
      <div style={{ maxWidth: '28rem', margin: '0 auto', width: '100%', position: 'relative', zIndex: 10 }}>
        <div style={{ marginBottom: '24px' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '12px' }}>
            <div style={{ fontSize: '12px', letterSpacing: '0.25em', fontFamily: FONT_BODY, color: C.sodium }}>
              {scene.year} · {scene.age}
            </div>
          </div>
          <div style={{ fontSize: '0.85rem', letterSpacing: '0.18em', paddingBottom: '12px',
            borderBottom: `1px solid ${C.concrete}`, fontFamily: FONT_DISPLAY, color: C.paper }}>
            {scene.location}
          </div>
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: '20px', marginBottom: '32px', minHeight: '200px' }}>
          {scene.text.map((line, i) => (
            <p key={i} style={{ lineHeight: 1.6, margin: 0,
              fontFamily: FONT_BODY, fontSize: '1.05rem', color: C.paper,
              opacity: revealed ? 1 : 0,
              transform: revealed ? 'translateY(0)' : 'translateY(8px)',
              transition: `all 0.6s ease-out ${i * 0.25}s`,
              textShadow: '0 1px 4px rgba(0,0,0,0.7)' }}>
              {line}
            </p>
          ))}
        </div>

        <div style={{ marginBottom: '16px', textAlign: 'center',
          opacity: revealed ? 1 : 0,
          transition: `opacity 0.5s ease-out ${0.3 + scene.text.length * 0.25}s` }}>
          <span style={{ fontFamily: FONT_DISPLAY, color: C.sodium,
            letterSpacing: '0.25em', fontSize: '0.95rem',
            borderTop: `1px solid ${C.concrete}`, borderBottom: `1px solid ${C.concrete}`,
            padding: '6px 14px', display: 'inline-block' }}>
            ▷ WHAT WOULD YOU DO?
          </span>
        </div>

        {scene.timed && revealed && (
          <TimerBar seconds={scene.timed} onTimeout={handleTimeout} paused={selectedIdx !== null}/>
        )}

        <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
          {scene.choices.map((choice, i) => {
            const isSelected = selectedIdx === i;
            const isOther = selectedIdx !== null && selectedIdx !== i;
            return (
              <button key={i} onClick={() => handleChoose(choice, i)}
                disabled={selectedIdx !== null}
                style={{ width: '100%', textAlign: 'left', padding: '16px',
                  fontFamily: FONT_HAND, fontSize: '1.1rem',
                  color: isOther ? C.paperDim : C.paper,
                  backgroundColor: isSelected ? C.sodium : 'rgba(34,31,27,0.85)',
                  backdropFilter: 'blur(2px)',
                  border: `1px solid ${C.concrete}`,
                  borderLeft: `3px solid ${isSelected ? C.paper : C.sodium}`,
                  opacity: revealed ? (isOther ? 0.4 : 1) : 0,
                  transform: revealed ? (isSelected ? 'translateX(4px) scale(1.02)' : 'translateY(0)') : 'translateY(8px)',
                  transition: `all 0.5s ease-out ${0.3 + scene.text.length * 0.25 + i * 0.1}s, background-color 0.2s ease, transform 0.2s ease, opacity 0.3s ease`,
                  lineHeight: 1.3,
                  cursor: selectedIdx !== null ? 'default' : 'pointer',
                  textDecoration: isOther ? 'line-through' : 'none' }}>
                {choice.text}
                {isSelected && <span style={{ color: C.ink, marginLeft: '0.5em', fontFamily: FONT_DISPLAY }}> →</span>}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [stage, setStage] = useState('agegate');
  const [currentIdx, setCurrentIdx] = useState(0);
  const [stats, setStats] = useState({ self: 0, mask: 0, outside: 0, damage: 0, friend: 0 });
  const [inventory, setInventory] = useState([]);
  const [endingId, setEndingId] = useState(null);
  const [pickup, setPickup] = useState(null);
  const [walkText, setWalkText] = useState('');
  const pendingNextIdx = useRef(null);

  const playableScenes = useMemo(() => SCENES.filter((s) => s.choices), []);

  function start() {
    setStage('playing'); setCurrentIdx(0);
    setStats({ self: 0, mask: 0, outside: 0, damage: 0, friend: 0 });
    setInventory([]); setPickup(null);
  }

  function choose(choice) {
    const newStats = { ...stats };
    let finalChoice = null;
    let pickedUp = null;
    Object.entries(choice.effects || {}).forEach(([k, v]) => {
      if (k === '_final') { finalChoice = v; return; }
      if (k === 'pickup') { pickedUp = v; return; }
      if (k === 'intense') return;
      newStats[k] = (newStats[k] || 0) + v;
    });
    setStats(newStats);
    if (pickedUp) {
      setInventory((inv) => [...inv, pickedUp]);
      setPickup(pickedUp);
      setTimeout(() => setPickup(null), 2400);
    }
    if (finalChoice) {
      const ending = computeEnding(newStats, finalChoice);
      setEndingId(ending);
      setWalkText('And then...');
      pendingNextIdx.current = 'ending';
      setStage('walking');
      window.scrollTo(0, 0);
      return;
    }
    const next = SCENES[currentIdx + 1];
    if (next) {
      setWalkText(next.walkText || 'Walking on...');
      pendingNextIdx.current = currentIdx + 1;
      setStage('walking');
      window.scrollTo(0, 0);
    }
  }

  function continueSensory() {
    setCurrentIdx((i) => i + 1);
    window.scrollTo(0, 0);
  }
  function onWalkComplete() {
    if (pendingNextIdx.current === 'ending') {
      setStage('ending'); pendingNextIdx.current = null;
      window.scrollTo(0, 0);
      return;
    }
    if (pendingNextIdx.current !== null) {
      setCurrentIdx(pendingNextIdx.current);
      pendingNextIdx.current = null;
    }
    setStage('playing');
    window.scrollTo(0, 0);
  }
  function restart() {
    setStage('intro');
    window.scrollTo(0, 0);
  }

  const scene = SCENES[currentIdx];
  const playableIndex = scene && scene.choices ? playableScenes.findIndex((s) => s.id === scene.id) + 1 : 0;
  const showHUD = stage === 'playing';

  return (
    <div style={{ position: 'relative', minHeight: '100vh', backgroundColor: C.bg,
      animation: 'flicker 4s infinite' }}>
      {showHUD && <CompassHUD stats={stats} sceneIndex={playableIndex} totalScenes={playableScenes.length}/>}
      {pickup && <PickupToast item={pickup}/>}
      {stage === 'agegate' && <AgeGate onEnter={() => setStage('intro')}/>}
      {stage === 'intro' && <CinematicIntro onComplete={start}/>}
      {stage === 'playing' && scene && scene.type === 'sensory' && (
        <SensoryScene scene={scene} onContinue={continueSensory}/>
      )}
      {stage === 'playing' && scene && scene.choices && (
        <Scene scene={scene} onChoose={choose} sceneIndex={playableIndex} totalScenes={playableScenes.length}/>
      )}
      {stage === 'walking' && (
        <ThreeMazeTransition text={walkText} onComplete={onWalkComplete} duration={2800}/>
      )}
      {stage === 'ending' && endingId && (
        <Ending ending={ENDINGS[endingId]} stats={stats} inventory={inventory} onRestart={restart}/>
      )}
      <Scanlines/>
      <Grain/>
      <Vignette/>
    </div>
  );
}

// Hide loading screen as soon as the app mounts (not on window 'load',
// which may never fire cleanly on mobile). Trap any startup error visibly.
function hideLoading(){
  var el = document.getElementById('loading');
  if (el) el.classList.add('hide');
}
window.addEventListener('error', function(e){
  var l = document.getElementById('loading');
  if (l) {
    l.classList.remove('hide');
    l.innerHTML = '<h1 style="font-size:20px">The Manchester Maze</h1>'
      + '<div style="font-family:monospace;color:#caa;max-width:90%;margin:14px auto;font-size:12px;line-height:1.5">'
      + 'Hit a snag loading: ' + (e.message||'') + '<br><br>Try refreshing the page.</div>';
  }
});

try {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
  // give React a tick to paint, then reveal it
  setTimeout(hideLoading, 400);
} catch (err) {
  var l = document.getElementById('loading');
  if (l) l.querySelector('.dots').textContent = 'Error: ' + (err.message||'failed to start');
}
</script>
